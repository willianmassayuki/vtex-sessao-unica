<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>VTEX Sessão Única</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>VTEX Sessão Única</h1>
    <label class="switch" title="Ligado: aplica o token sozinho ao abrir qualquer host da conta. Desligado: só pelo botão.">
      <input type="checkbox" id="auto">
      <span>Automático</span>
    </label>
  </header>

  <section id="current" class="card">
    <p class="muted">Carregando…</p>
  </section>

  <section>
    <h2>Contas com sessão</h2>
    <ul id="accounts"></ul>
    <p id="empty" class="muted" hidden>Nenhuma ainda. Faça login uma vez no admin de uma conta.</p>
  </section>

  <p id="toast" role="status" hidden></p>

  <footer class="muted">
    Os tokens ficam só na memória do navegador e somem quando ele é fechado.
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
